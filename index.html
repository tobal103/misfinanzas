function getDep(inv){return(inv.movements||[]).reduce((s,m)=>s+(m.type==="deposit"?m.amount:m.type==="withdrawal"?-m.amount:0),0)}
function getRet(inv){const d=getDep(inv);return d>0?((inv.amount-d)/d)*100:0}
function getGain(inv){return inv.amount-getDep(inv)}
function toCLP(amount,currency,rates){if(!currency||currency==="CLP")return amount;if(currency==="USD")return amount*(rates.USD||950);if(currency==="EUR")return amount*(rates.EUR||1050);if(currency==="UF")return amount*(rates.UF||38000);return amount}
function fmtCur(amount,currency){if(!currency||currency==="CLP")return fmt(amount);if(currency==="USD")return"US$"+Math.round(amount).toLocaleString("es-CL");if(currency==="EUR")return"€"+Math.round(amount).toLocaleString("es-CL");if(currency==="UF")return"UF "+amount.toLocaleString("es-CL",{minimumFractionDigits:2,maximumFractionDigits:2});return fmt(amount)}

/* ── Line Chart - uses snapshots array [{v,dep,label}] ── */
function LineChart({snapshots}){
  if(!snapshots||snapshots.length<2)return <div style={{textAlign:"center",padding:20,color:C.t3,fontSize:13}}>Registra un depósito o actualiza el valor para ver el gráfico</div>;
  const w=340,h=140,px=10,py=10;
  const vals=snapshots.map(s=>s.v);const deps=snapshots.map(s=>s.dep);
  const allV=[...vals,...deps];const mn=Math.min(...allV)*0.95;const mx=Math.max(...allV)*1.05||1;
  const rng=mx-mn||1;
  const scX=i=>px+(i/(snapshots.length-1))*(w-2*px);
  const scY=v=>h-py-((v-mn)/rng)*(h-2*py);
  const line=data=>{let d="";data.forEach((v,i)=>{d+=(i===0?"M":"L")+scX(i).toFixed(1)+","+scY(v).toFixed(1)});return d};
  const area=data=>{let d="";data.forEach((v,i)=>{d+=(i===0?"M":"L")+scX(i).toFixed(1)+","+scY(v).toFixed(1)});d+=`L${scX(data.length-1).toFixed(1)},${(h-py)}L${scX(0).toFixed(1)},${(h-py)}Z`;return d};
  return(<div>
    <svg viewBox={`0 0 ${w} ${h}`} style={{width:"100%",height:"auto"}}>
      <defs><linearGradient id="gV" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={C.acc} stopOpacity="0.3"/><stop offset="100%" stopColor={C.acc} stopOpacity="0.02"/></linearGradient></defs>
      <path d={area(vals)} fill="url(#gV)"/>
      <path d={line(deps)} stroke="#94A3B8" strokeWidth="1.5" fill="none" strokeDasharray="4,3"/>
      <path d={line(vals)} stroke={C.acc} strokeWidth="2.5" fill="none"/>
      <circle cx={scX(vals.length-1)} cy={scY(vals[vals.length-1])} r="4" fill={C.acc}/>
    </svg>
    <div style={{display:"flex",gap:16,justifyContent:"center",marginTop:4}}>
      <div style={{display:"flex",alignItems:"center",gap:4,fontSize:11,color:C.t2}}><div style={{width:14,height:3,background:C.acc,borderRadius:2}}/> Valor</div>
      <div style={{display:"flex",alignItems:"center",gap:4,fontSize:11,color:C.t2}}><div style={{width:14,height:2,borderTop:"2px dashed #94A3B8"}}/> Aportes</div>
    </div>
  </div>);
}

      {err&&<div style={{color:C.dan,fontSize:13,marginBottom:10}}>{err}</div>}
      <button style={{...S.btn,background:C.acc,color:"#fff",marginTop:6}} onClick={go}>{reg?"Crear cuenta":"Entrar"}</button>
      <button style={{...S.btn,background:"none",color:C.t2,marginTop:6,fontSize:14}} onClick={()=>{setReg(!reg);setErr("")}}>{reg?"¿Ya tienes cuenta?":"¿No tienes cuenta?"}</button>

/* ── Edit Movement Form ── */
function EditMovForm({mov,idx,inv,onUpdate,onClose}){
  const[amt,setAmt]=useState(String(mov.amount));
  const[note,setNote]=useState(mov.note||"");
  const save=()=>{
    const val=parseFloat(amt)||0;if(val<=0)return;
    const newMovs=[...inv.movements];newMovs[idx]={...newMovs[idx],amount:val,note:note||newMovs[idx].note};
    const ni={...inv,movements:newMovs};
    // Recalculate amount based on movements
    let currentVal=0;
    newMovs.forEach(m=>{if(m.type==="deposit")currentVal+=m.amount;else if(m.type==="withdrawal")currentVal-=m.amount;else if(m.type==="valuation")currentVal=m.amount});
    ni.amount=Math.max(0,currentVal);
    // Rebuild snapshots
    let dep2=0;const snaps2=[];
    newMovs.forEach(m=>{if(m.type==="deposit")dep2+=m.amount;else if(m.type==="withdrawal")dep2-=m.amount;
      const v2=m.type==="valuation"?m.amount:(m.type==="deposit"?dep2:dep2);
      snaps2.push({v:m.type==="valuation"?m.amount:ni.amount,dep:dep2,label:fD(m.date)})});
    // Simpler: just rebuild from movements
    let runVal=0;let runDep=0;const snaps3=[];
    newMovs.forEach(m=>{
      if(m.type==="deposit"){runDep+=m.amount;runVal+=m.amount}
      else if(m.type==="withdrawal"){runDep-=m.amount;runVal-=m.amount}
      else if(m.type==="valuation"){runVal=m.amount}
      snaps3.push({v:runVal,dep:runDep,label:fD(m.date)})});
    ni.snapshots=snaps3;ni.amount=Math.max(0,runVal);
    onUpdate(ni);onClose();
  };
  const del=()=>{
    if(inv.movements.length<=1){alert("No puedes eliminar el único movimiento");return}
    const newMovs=inv.movements.filter((_,i)=>i!==idx);
    const ni={...inv,movements:newMovs};
    let runVal=0;let runDep=0;const snaps=[];
    newMovs.forEach(m=>{
      if(m.type==="deposit"){runDep+=m.amount;runVal+=m.amount}
      else if(m.type==="withdrawal"){runDep-=m.amount;runVal-=m.amount}
      else if(m.type==="valuation"){runVal=m.amount}
      snaps.push({v:runVal,dep:runDep,label:fD(m.date)})});
    ni.snapshots=snaps;ni.amount=Math.max(0,runVal);
    onUpdate(ni);onClose();
  };

    <div style={{marginBottom:14}}><label style={S.label}>Monto</label><input style={S.input} type="number" value={amt} onChange={e=>setAmt(e.target.value)}/></div>
    <div style={{marginBottom:14}}><label style={S.label}>Nota</label><input style={S.input} value={note} onChange={e=>setNote(e.target.value)}/></div>
    <div style={{display:"flex",gap:10}}>
      <button style={{...S.btn,background:C.dan,color:"#fff",flex:1}} onClick={del}>🗑 Eliminar</button>
      <button style={{...S.btn,background:C.acc,color:"#fff",flex:2}} onClick={save}>Guardar</button>
    </div>
  </div>);
}

function RiskBreakdown({label,icon,color,items,rates,target}){
  var rTot=items.reduce(function(s,i){return s+toCLP(i.amount||0,i.currency,rates)},0);
  if(rTot===0)return null;
  var rB={bajo:0,medio:0,alto:0};
  items.forEach(function(i){rB[i.risk||"medio"]+=toCLP(i.amount||0,i.currency,rates)});
  return(<div style={S.card}>
    <div style={{fontSize:13,fontWeight:600,marginBottom:8,color:color}}>{icon} {label} — {fmt(rTot)}</div>
    <div style={{display:"flex",height:12,borderRadius:6,overflow:"hidden",marginBottom:8}}>
      {rB.bajo>0&&<div style={{width:(rB.bajo/rTot*100)+"%",background:rc.bajo}}/>}
      {rB.medio>0&&<div style={{width:(rB.medio/rTot*100)+"%",background:rc.medio}}/>}
      {rB.alto>0&&<div style={{width:(rB.alto/rTot*100)+"%",background:rc.alto}}/>}
    </div>
    {target&&<div style={{display:"flex",height:4,borderRadius:2,overflow:"hidden",marginBottom:4,opacity:0.35}}>
      <div style={{width:target.bajo+"%",background:rc.bajo}}/><div style={{width:target.medio+"%",background:rc.medio}}/><div style={{width:target.alto+"%",background:rc.alto}}/>
    </div>}
    {target&&<div style={{fontSize:10,color:C.t3,marginBottom:6}}>▲ Actual / ▼ Objetivo</div>}
    <div style={{display:"flex",justifyContent:"space-between",fontSize:11}}>
      {["bajo","medio","alto"].map(function(r){var pct=Math.round(rB[r]/rTot*100);var tgt=target?target[r]:null;var ok=tgt!==null?Math.abs(pct-tgt)<=5:true;return(
        <div key={r} style={{flex:1}}>

}

      </div>}
      <button style={{...S.btn,background:C.acc,color:"#fff"}} onClick={addGoal}>Agregar Meta</button>
    </div></div>}
  </>);
}


function Mercado({gKey}){
  var[data,setData]=useState(null);
  var[news,setNews]=useState(sto.get("mktNews")||[]);
  var[newsTime,setNewsTime]=useState(sto.get("mktNewsTime")||"");
  var[loadingNews,setLoadingNews]=useState(false);
  var[lastUpdate,setLastUpdate]=useState("");

  var fetchData=function(){
    fetch("https://mindicador.cl/api").then(function(r){return r.json()}).then(function(d){
      setData(d);setLastUpdate(new Date().toLocaleTimeString("es-CL",{hour:"2-digit",minute:"2-digit"}));
      sto.set("mktData",d);sto.set("mktTime",new Date().toISOString());
    }).catch(function(){var cached=sto.get("mktData");if(cached)setData(cached)});
  };

  var fetchNews=function(){
    if(!gKey)return;
    var now=new Date();var hour=now.getHours();
    var period=hour<12?"mañana":hour<18?"mediodía":"noche";
    var lastPeriod=sto.get("mktNewsPeriod")||"";
    var today=now.toISOString().split("T")[0];
    var lastDay=sto.get("mktNewsDay")||"";
    if(lastPeriod===period&&lastDay===today&&news.length>0)return;
    setLoadingNews(true);
    fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent?key="+gKey,{
      method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":gKey},
      body:JSON.stringify({contents:[{parts:[{text:"Dame las 6 noticias financieras más relevantes de HOY para un inversionista chileno. Incluye 3 noticias internacionales (mercados, Fed, bolsas) y 3 de Chile (economía, tasas, bolsa Santiago). Para cada una: un emoji relevante, título corto (max 10 palabras), y una línea de contexto. Formato: EMOJI TITULO | Contexto breve. Una noticia por línea. Sin introducción ni cierre."}]}]})
    }).then(function(r){return r.json()}).then(function(d){
      var txt=d?.candidates?.[0]?.content?.parts?.[0]?.text||"";
      var items=txt.split("\n").filter(function(l){return l.trim().length>10}).slice(0,6);
      setNews(items);sto.set("mktNews",items);
      sto.set("mktNewsPeriod",period);sto.set("mktNewsDay",today);
      setNewsTime(period);sto.set("mktNewsTime",period);
      setLoadingNews(false);
    }).catch(function(){setLoadingNews(false)});
  };

  useEffect(function(){
    fetchData();fetchNews();
    var interval=setInterval(fetchData,300000);
    return function(){clearInterval(interval)};
  },[]);

  var indicators=[
    {key:"dolar",name:"Dólar",emoji:"🇺🇸",prefix:"$"},
    {key:"euro",name:"Euro",emoji:"🇪🇺",prefix:"$"},
    {key:"uf",name:"UF",emoji:"📊",prefix:"$"},
    {key:"utm",name:"UTM",emoji:"📋",prefix:"$"},
    {key:"bitcoin",name:"Bitcoin",emoji:"₿",prefix:"US$"},
    {key:"libra_cobre",name:"Cobre (lb)",emoji:"🔶",prefix:"US$"},
    {key:"tpm",name:"TPM",emoji:"🏦",suffix:"%"},
    {key:"ipc",name:"IPC",emoji:"📈",suffix:"%"},
    {key:"imacec",name:"IMACEC",emoji:"🏭",suffix:"%"},
    {key:"tasa_desempleo",name:"Desempleo",emoji:"👷",suffix:"%"},
  ];

  return(<>
    <div style={{padding:"calc(24px + var(--st)) 20px 8px"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div style={{fontSize:22,fontWeight:700}}>Mercado</div>
        <div style={{fontSize:11,color:C.t3}}>{lastUpdate&&"⟳ "+lastUpdate}</div>
      </div>
    </div>
    <div style={{padding:"8px 20px 0"}}>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
        {indicators.map(function(ind){
          if(!data||!data[ind.key])return null;
          var val=data[ind.key].valor;
          var formatted=ind.prefix?(ind.prefix+Math.round(val).toLocaleString("es-CL")):(val.toFixed(1)+ind.suffix);
          return(<div key={ind.key} style={S.card}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div style={{fontSize:11,color:C.t2,fontWeight:500}}>{ind.emoji} {ind.name}</div>
            </div>
            <div style={{fontSize:18,fontWeight:700,color:C.pri,marginTop:2}}>{formatted}</div>
            <div style={{fontSize:10,color:C.t3}}>{data[ind.key].fecha?new Date(data[ind.key].fecha).toLocaleDateString("es-CL"):""}</div>
          </div>)
        })}
      </div>

      {!data&&<div style={{textAlign:"center",padding:30,color:C.t3}}>Cargando indicadores...</div>}

      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:16,marginBottom:10}}>
        <div style={{fontSize:16,fontWeight:700}}>📰 Noticias</div>
        {newsTime&&<span style={{fontSize:11,color:C.t3,background:C.inp,padding:"3px 8px",borderRadius:8}}>{newsTime}</span>}
      </div>

      {!gKey&&<div style={{...S.card,textAlign:"center",padding:20}}>
        <div style={{fontSize:13,color:C.t2}}>Activa Gemini en ⚙️ Ajustes para ver noticias financieras actualizadas 3 veces al día</div>
      </div>}

      {loadingNews&&<div style={{textAlign:"center",padding:20,color:C.t3}}>⏳ Cargando noticias...</div>}

      {news.length>0&&news.map(function(n,i){
        var parts=n.split("|");
        var title=parts[0]||n;
        var ctx=parts[1]||"";
        return(<div key={i} style={{...S.card,padding:12}}>
          <div style={{fontSize:14,fontWeight:600,color:C.pri}}>{title.trim()}</div>
          {ctx&&<div style={{fontSize:12,color:C.t2,marginTop:2}}>{ctx.trim()}</div>}
        </div>)
      })}

      <div style={{fontSize:10,color:C.t3,textAlign:"center",padding:"12px 0",marginBottom:20}}>
        Indicadores: mindicador.cl (Banco Central) · Actualización cada 5 min<br/>
        Noticias: IA Gemini · 3 actualizaciones diarias (mañana/mediodía/noche)
      </div>
    </div>
  </>);
}

/* ── Export Report ── */
function ExportModal({onClose,inv,rates}){
  const tV=inv.reduce(function(s,i){return s+toCLP(i.amount||0,i.currency,rates)},0);
  const tC=inv.reduce(function(s,i){return s+toCLP(getDep(i),i.currency,rates)},0);
  const tR=tC>0?((tV-tC)/tC)*100:0;
  const bC={};inv.forEach(function(i){var cat=i.customCategory||i.category;bC[cat]=(bC[cat]||0)+toCLP(i.amount||0,i.currency,rates)});
  const bR={bajo:0,medio:0,alto:0};inv.forEach(function(i){bR[i.risk||"medio"]+=toCLP(i.amount||0,i.currency,rates)});

  const dlCSV=()=>{
    var csv="Nombre,Plataforma,Tipo,Categoria,Riesgo,Valor Actual,Aportado,Ganancia,Retorno %,Moneda\n";
    inv.forEach(i=>{const d=getDep(i);const g=i.amount-d;const r=d>0?((i.amount-d)/d)*100:0;
      csv+='"'+i.name+'","'+(i.platform||"")+'","'+i.type+'","'+i.category+'","'+rl[i.risk||"medio"]+'",'+Math.round(i.amount)+","+Math.round(d)+","+Math.round(g)+","+r.toFixed(1)+","+(i.currency||"CLP")+"\n"});
    csv+="\n";csv+="TOTAL,,,,,,"+Math.round(tV)+","+Math.round(tC)+","+Math.round(tV-tC)+","+tR.toFixed(1)+"\n";
    csv+="\nDistribución por Riesgo\n";
    ["bajo","medio","alto"].forEach(function(r){if(bR[r]>0)csv+=rl[r]+","+Math.round(bR[r])+","+(tV>0?((bR[r]/tV)*100).toFixed(1):0)+"%\n"});
    var blob=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8"});
    var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="MisFinanzas_Reporte_"+new Date().toISOString().split("T")[0]+".csv";a.click();
  };

  const dlPDF=()=>{
    const w=window.open("","_blank");
    const date=new Date().toLocaleDateString("es-CL",{day:"numeric",month:"long",year:"numeric"});
    var catRows="";Object.entries(bC).sort(function(a,b){return b[1]-a[1]}).forEach(function(e){var c=e[0],v=e[1];catRows+="<tr><td>"+c+"</td><td style=\"text-align:right\">"+fmt(v)+"</td><td style=\"text-align:right\">"+(tV>0?((v/tV)*100).toFixed(1):0)+"%</td></tr>"});
    var invRows="";inv.forEach(function(i){var d=getDep(i);var g=i.amount-d;var r=d>0?((i.amount-d)/d)*100:0;var gc=g>=0?"#059669":"#EF4444";
      invRows+="<tr><td>"+i.name+"</td><td>"+(i.platform||"-")+"</td><td>"+i.category+"</td><td>"+rl[i.risk||"medio"]+"</td><td style=\"text-align:right\">"+fmt(i.amount)+"</td><td style=\"text-align:right\">"+fmt(d)+"</td><td style=\"text-align:right;color:"+gc+"\">"+fmt(g)+"</td><td style=\"text-align:right;color:"+gc+"\">"+fP(r)+"</td></tr>"});
    var riskRows="";["bajo","medio","alto"].forEach(function(r){if(bR[r]>0)riskRows+="<tr><td>"+rl[r]+"</td><td style=\"text-align:right\">"+fmt(bR[r])+"</td><td style=\"text-align:right\">"+(tV>0?((bR[r]/tV)*100).toFixed(1):0)+"%</td></tr>"});
    var gc2=(tV-tC)>=0?"#059669":"#EF4444";
    var h="<!DOCTYPE html><html><head><meta charset=\"UTF-8\"><title>Reporte</title>";
    h+="<style>*{margin:0;padding:0;box-sizing:border-box;font-family:Georgia,serif}body{padding:40px;color:#0A2540;font-size:12px}";
    h+="h1{font-size:22px;margin-bottom:4px}h2{font-size:14px;margin:24px 0 8px;color:#5A6978;text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid #E2E8F0;padding-bottom:4px}";
    h+=".sub{color:#5A6978;font-size:12px;margin-bottom:24px}";
    h+=".summary{display:flex;gap:20px;margin-bottom:24px}.sbox{background:#F8FAFC;border-radius:8px;padding:16px;flex:1;text-align:center}.sbox .lb{font-size:10px;color:#5A6978;text-transform:uppercase}.sbox .vl{font-size:20px;font-weight:700;margin-top:4px}";
    h+="table{width:100%;border-collapse:collapse;margin-bottom:16px}th,td{padding:8px 10px;text-align:left;border-bottom:1px solid #E2E8F0;font-size:11px}th{background:#F8FAFC;font-weight:600;color:#5A6978;text-transform:uppercase;font-size:10px}";
    h+=".footer{margin-top:32px;padding-top:12px;border-top:1px solid #E2E8F0;font-size:10px;color:#94A3B8;text-align:center}";
    h+="@media print{body{padding:20px}}</style></head><body>";
    h+="<h1>Reporte de Portafolio</h1><div class=\"sub\">Generado el "+date+" - MisFinanzas</div>";
    h+="<div class=\"summary\">";
    h+="<div class=\"sbox\"><div class=\"lb\">Patrimonio</div><div class=\"vl\">"+fmt(tV)+"</div></div>";
    h+="<div class=\"sbox\"><div class=\"lb\">Aportado</div><div class=\"vl\">"+fmt(tC)+"</div></div>";
    h+="<div class=\"sbox\"><div class=\"lb\">Ganancia</div><div class=\"vl\" style=\"color:"+gc2+"\">"+fmt(tV-tC)+"</div></div>";
    h+="<div class=\"sbox\"><div class=\"lb\">Retorno</div><div class=\"vl\" style=\"color:"+gc2+"\">"+fP(tR)+"</div></div></div>";
    h+="<h2>Detalle de Inversiones</h2>";
    h+="<table><thead><tr><th>Nombre</th><th>Plataforma</th><th>Categoria</th><th>Riesgo</th><th style=\"text-align:right\">Valor</th><th style=\"text-align:right\">Aportado</th><th style=\"text-align:right\">Ganancia</th><th style=\"text-align:right\">Retorno</th></tr></thead><tbody>"+invRows;
    h+="<tr style=\"font-weight:700;border-top:2px solid #0A2540\"><td colspan=\"4\">TOTAL</td><td style=\"text-align:right\">"+fmt(tV)+"</td><td style=\"text-align:right\">"+fmt(tC)+"</td><td style=\"text-align:right;color:"+gc2+"\">"+fmt(tV-tC)+"</td><td style=\"text-align:right;color:"+gc2+"\">"+fP(tR)+"</td></tr></tbody></table>";
    h+="<h2>Por Categoria</h2><table><thead><tr><th>Categoria</th><th style=\"text-align:right\">Monto</th><th style=\"text-align:right\">%</th></tr></thead><tbody>"+catRows+"</tbody></table>";
    h+="<h2>Por Riesgo</h2><table><thead><tr><th>Nivel</th><th style=\"text-align:right\">Monto</th><th style=\"text-align:right\">%</th></tr></thead><tbody>"+riskRows+"</tbody></table>";
    h+="<div class=\"footer\">Generado por MisFinanzas - No constituye asesoria financiera</div>";
    h+="<scr"+"ipt>setTimeout(function(){window.print()},500)</scr"+"ipt></body></html>";
    w.document.write(h);
    w.document.close();
  };

  return(<div style={S.modal} onClick={e=>e.target===e.currentTarget&&onClose()}><div style={S.sheet}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}><div style={{fontSize:20,fontWeight:700}}>📤 Exportar Reporte</div><button onClick={onClose} style={{background:"none",border:"none",cursor:"pointer"}}><Ic name="x"/></button></div>
    <p style={{fontSize:13,color:C.t2,marginBottom:16,lineHeight:1.5}}>Genera un reporte profesional con todo tu portafolio.</p>
    <button style={{...S.btn,background:C.pri,color:"#fff",marginBottom:10}} onClick={dlPDF}>📄 Reporte PDF (imprimir/guardar)</button>
    <button style={{...S.btn,background:"none",border:`2px solid ${C.pri}`,color:C.pri}} onClick={dlCSV}>📊 Descargar Excel (CSV)</button>
    <div style={{fontSize:11,color:C.t3,textAlign:"center",marginTop:12}}>El PDF se abre para imprimir — elige "Guardar como PDF"</div>
  </div></div>);
}

/* ── AI Chat Modal ── */
function ChatModal({onClose,inv,gKey}){
  const[msgs,setMsgs]=useState([{role:"assistant",text:"Hola, soy tu asesor financiero IA. Puedo analizar tu portafolio, responder preguntas sobre tus inversiones, sugerir estrategias y más. ¿En qué te puedo ayudar?"}]);
  const[input,setInput]=useState("");const[busy,setBusy]=useState(false);const endRef=useRef(null);
  useEffect(()=>{endRef.current?.scrollIntoView({behavior:"smooth"})},[msgs]);

  const buildContext=()=>{
    const tV=inv.reduce((s,i)=>s+(i.amount||0),0);const tC=inv.reduce((s,i)=>s+getDep(i),0);
    let ctx=`Portafolio del usuario (${inv.length} inversiones, patrimonio total: $${Math.round(tV).toLocaleString("es-CL")} CLP, aportado: $${Math.round(tC).toLocaleString("es-CL")}, ganancia: $${Math.round(tV-tC).toLocaleString("es-CL")}):\n`;
    inv.forEach(i=>{const d=getDep(i);const r=d>0?((i.amount-d)/d)*100:0;ctx+=`- ${i.name} (${i.platform||"?"}, ${i.category}, riesgo ${i.risk||"medio"}, tipo ${i.type}): valor $${Math.round(i.amount).toLocaleString("es-CL")}, aportado $${Math.round(d).toLocaleString("es-CL")}, retorno ${r.toFixed(1)}%\n`});
    return ctx;
  };

  const send=async()=>{
    if(!input.trim()||busy)return;
    if(!gKey){setMsgs(p=>[...p,{role:"user",text:input},{role:"assistant",text:"Para usar el chat necesitas configurar tu API Key de Gemini en ⚙️ Ajustes. Es gratis."}]);setInput("");return}
    const userMsg=input;setInput("");setMsgs(p=>[...p,{role:"user",text:userMsg}]);setBusy(true);
    try{
      const ctx=buildContext();
      const resp=await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent?key="+gKey,{
        method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":gKey},
        body:JSON.stringify({contents:[{parts:[{text:"Eres un asesor financiero experto. Responde en español, conciso y profesional. Contexto del portafolio:\n"+ctx+"\nPregunta del usuario: "+userMsg}]}]})
      });
      const data=await resp.json();const txt=data?.candidates?.[0]?.content?.parts?.[0]?.text||"No pude procesar tu pregunta.";
      setMsgs(p=>[...p,{role:"assistant",text:txt}]);
    }catch{setMsgs(p=>[...p,{role:"assistant",text:"Error de conexión. Verifica tu API Key."}])}
    setBusy(false);
  };

  return(<div style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:C.bg,zIndex:200,display:"flex",flexDirection:"column",maxWidth:480,margin:"0 auto"}}>
    <div style={{padding:"calc(16px + var(--st)) 20px 12px",background:C.pri,display:"flex",alignItems:"center",gap:12}}>
      <button onClick={onClose} style={{background:"none",border:"none",cursor:"pointer"}}><Ic name="back" size={24} color="#fff"/></button>
      <div style={{flex:1}}><div style={{fontSize:17,fontWeight:700,color:"#fff"}}>💬 Asesor IA</div><div style={{fontSize:11,color:"rgba(255,255,255,0.5)"}}>{gKey?"Gemini conectado":"Configura API Key en ⚙️"}</div></div>
    </div>
    <div style={{flex:1,overflowY:"auto",padding:"16px 20px"}}>
      {msgs.map((m,i)=>(<div key={i} style={{marginBottom:12,display:"flex",justifyContent:m.role==="user"?"flex-end":"flex-start"}}>
        <div style={{maxWidth:"85%",padding:"10px 14px",borderRadius:m.role==="user"?"16px 16px 4px 16px":"16px 16px 16px 4px",background:m.role==="user"?C.acc:C.card,color:m.role==="user"?"#fff":C.t1,fontSize:14,lineHeight:1.5,boxShadow:m.role==="user"?"none":"0 1px 3px rgba(0,0,0,0.06)",whiteSpace:"pre-wrap"}}>{m.text}</div>
      </div>))}
      {busy&&<div style={{display:"flex",justifyContent:"flex-start",marginBottom:12}}><div style={{padding:"10px 14px",borderRadius:"16px 16px 16px 4px",background:C.card,fontSize:14,color:C.t3}}>Pensando...</div></div>}
      <div ref={endRef}/>
    </div>
    <div style={{padding:`12px 20px calc(16px + var(--sb))`,background:"#fff",borderTop:`1px solid ${C.brd}`,display:"flex",gap:8}}>
      <input style={{...S.input,flex:1,padding:"12px 14px"}} placeholder="Pregunta sobre tu portafolio..." value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&send()}/>
      <button onClick={send} disabled={busy} style={{background:C.acc,border:"none",borderRadius:12,padding:"0 16px",cursor:"pointer",fontSize:18,color:"#fff"}}>↑</button>
    </div>
  </div>);
}


ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
